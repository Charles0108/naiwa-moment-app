name: naiwa_moment
description: 奶娃片刻，离线番茄钟与安静场景。
publish_to: none
version: 0.1.2+3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  shared_preferences: ^2.5.6
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  window_manager: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/scenes/
    - assets/scenes/forward_loops/
    - assets/scenes/reverse_loops/
    - assets/scenes/stills/
    - assets/scenes/posters/
